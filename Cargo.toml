[workspace]
resolver = "2"
members = [
    "crates/zsdesk-core",
    "crates/zsdesk-platform",
    "crates/zsdesk-app",
    "crates/zsdesk-ui",
    "crates/zsdesk-windows",
]

[workspace.package]
version = "0.4.4"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"

# Size-oriented code generation for the Windows release.
[profile.release.package.zsdesk-windows]
opt-level = "s"

[profile.release.package.zsdesk-ui]
opt-level = "s"

[profile.release.package.zsui]
opt-level = "s"

# Share code across the application and optimize for offline distribution.
[profile.release.package.zsdesk-app]
opt-level = "s"
codegen-units = 1
