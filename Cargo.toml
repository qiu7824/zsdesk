[workspace]
resolver = "2"
members = [
    "crates/zsdesk-core",
    "crates/zsdesk-platform",
    "crates/zsdesk-app",
    "crates/zsdesk-ui",
    "crates/zsdesk-windows",
]

[workspace.package]
version = "0.3.12"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"
